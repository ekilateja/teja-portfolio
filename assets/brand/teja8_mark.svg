<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="teja8">
  <!-- Top loop -->
  <circle cx="50" cy="40" r="22" fill="none" stroke="#000000" stroke-width="7"/>
  <!-- Bottom loop -->
  <circle cx="50" cy="100" r="22" fill="none" stroke="#000000" stroke-width="7"/>
  <!-- Light ray (beam) -->
  <rect x="0" y="68" width="100" height="1.4" fill="#000000"/>
  <!-- Wordmark on the beam -->
  <text x="50" y="70.6" text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="5.5" font-weight="500" letter-spacing="2.5" fill="#FFFFFF">EKILA TEJA</text>
</svg>
