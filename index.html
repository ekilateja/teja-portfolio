<!DOCTYPE html>
<html>
<head>
  <base href="/teja-portfolio/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Product Design Portfolio — A story of craft, curiosity, and code. FAANG-level product designer.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0B">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/brand/teja8_mark.svg">
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/Icon-192.png">

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">

  <title>teja8 — Product Designer</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0A0A0B;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #0A0A0B;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    .loading-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #8FBC8F;
      animation: loadPulse 1.4s ease-in-out infinite;
    }
    @keyframes loadPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <div class="loading-dot"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      loading.classList.add('fade-out');
      setTimeout(() => loading.remove(), 900);
    });
  </script>
</body>
</html>
